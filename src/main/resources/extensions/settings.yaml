apiVersion: v1alpha1
kind: Setting
metadata:
  name: plugin-links-settings
spec:
  forms:
    - group: base
      label: 基本设置
      formSchema:
        - $formkit: text
          label: 页面标题
          name: title
          validation: required
          value: "链接"
    - group: verification
      label: 链接检测
      formSchema:
        - $formkit: checkbox
          label: 启用自动定时检测
          name: enabled
          id: verification_enabled
          value: false
          help: 启用后，系统会自动定时检测链接的可达性，并更新链接的可达性状态，如果关闭，可以在链接管理页面手动检测
        - $formkit: number
          if: "$get(verification_enabled).value === true"
          label: 检测间隔（小时）
          name: intervalHours
          validation: required|number|min:1
          value: 24
        - $formkit: number
          if: "$get(verification_enabled).value === true"
          label: 每轮最多检测链接数
          name: maxLinksPerRun
          validation: required|number|min:1
          value: 50
        - $formkit: checkbox
          if: "$get(verification_enabled).value === true"
          label: 同时检测反链
          name: checkBacklink
          value: false
    - group: rss
      label: RSS 订阅
      formSchema:
        - $formkit: checkbox
          label: 启用自动获取
          name: enabled
          id: rss_refresh_enabled
          value: true
          help: 启用后，系统会自动定时获取链接的 RSS 订阅，并更新链接的 RSS 订阅状态，如果关闭，可以在链接订阅页面手动获取
        - $formkit: number
          if: "$get(rss_refresh_enabled).value === true"
          label: 获取间隔（小时）
          name: intervalHours
          validation: required|number|min:1
          value: 1
        - $formkit: number
          if: "$get(rss_refresh_enabled).value === true"
          label: 每轮最多获取链接数
          name: maxLinksPerRun
          validation: required|number|min:1
          value: 50
        - $formkit: checkbox
          label: 公开 RSS 订阅动态
          name: publicEnabled
          value: false
          help: 部分主题可能需要显示 RSS 订阅信息，开启后匿名访问者和主题可以读取已抓取的 RSS 条目，请确认风险之后再决定是否开启
    - group: application
      label: 友链申请
      formSchema:
        - $formkit: checkbox
          label: 启用友链申请
          name: enabled
          id: link_application_enabled
          value: false
          help: 总开关。关闭后访客提交和评论自动识别都不会创建新申请，已有申请仍可继续审核
        - $formkit: group
          if: "$get(link_application_enabled).value === true"
          name: selfSubmission
          label: 访客自助申请
          children:
            - $formkit: checkbox
              label: 允许访客提交
              name: enabled
              value: true
              help: 允许访客通过原生 Form 或 REST API 提交申请，主题应根据 linkApplicationEnabled 决定是否展示申请入口
        - $formkit: group
          if: "$get(link_application_enabled).value === true"
          name: security
          label: 安全
          children:
            - $formkit: number
              label: 待审核申请容量
              name: pendingCapacity
              step: 1
              validation: 'required|number|min:1|matches:/^[1-9][0-9]*$/'
              value: 100
              help: 限制待审核友链申请的最大数量。达到上限后将暂停接收新申请，直到待审核数量下降
        - $formkit: group
          if: "$get(link_application_enabled).value === true"
          name: commentRecognition
          label: 从新评论中识别友链申请
          children:
            - $formkit: checkbox
              label: 开启
              name: enabled
              id: comment_application_recognition_enabled
              value: false
              help: 需要在应用市场安装并启用 AI Foundation 插件，且所选模型必须支持结构化输出，开启之后会根据评论来源配置自动识别友链申请并创建新申请，此功能将在每次有新评论的时候触发，所以请根据实际需要开启
            - $formkit: aiModelSelector
              if: "$get(comment_application_recognition_enabled).value === true"
              modelType: language
              clearable: true
              name: modelName
              key: recognitionModelName
              label: 识别模型
              placeholder: 请选择支持结构化输出的语言模型
              validation: required
            - $formkit: repeater
              if: "$get(comment_application_recognition_enabled).value === true"
              name: sources
              label: 评论来源
              value: []
              validation: required
              min: 1
              children:
                - $formkit: select
                  name: type
                  label: 页面类型
                  validation: required
                  options:
                    - label: 链接页面
                      value: LINKS
                    - label: 文章
                      value: POST
                    - label: 页面
                      value: SINGLE_PAGE
                - $formkit: postSelect
                  if: "$value.type === 'POST'"
                  name: name
                  label: 文章
                  validation: required
                  clearable: false
                - $formkit: singlePageSelect
                  if: "$value.type === 'SINGLE_PAGE'"
                  name: name
                  label: 页面
                  validation: required
                  clearable: false
        - $formkit: group
          if: "$get(link_application_enabled).value === true"
          name: notification
          label: 申请通知
          children:
            - $formkit: checkbox
              label: 开启通知
              name: enabled
              id: link_application_notification_enabled
              value: false
              help: 新的友链申请创建成功后，通过 Halo 通知机制提醒所选管理员
            - $formkit: userSelect
              if: "$get(link_application_notification_enabled).value === true"
              name: recipients
              label: 接收通知的管理员
              value: []
              multiple: true
              validation: required
              help: >-
                请选择拥有链接管理权限的管理员，插件不会自动校验权限。插件会按此列表维护通知订阅；
                邮件中的取消订阅不会修改此列表，如需停止接收，请移除用户或由用户在个人通知偏好中关闭此类型
    - group: ai
      label: AI
      formSchema:
        - $formkit: checkbox
          label: 开启 AI 功能
          name: enabled
          id: ai_enabled
          value: false
          help: 开启后，可以在支持的场景中使用 AI Foundation 提供的模型能力，需要在应用市场安装并启用 AI Foundation 插件
        - $formkit: group
          if: "$get(ai_enabled).value === true"
          name: commentExtraction
          label: 添加链接时从最新评论中解析
          children:
            - $formkit: checkbox
              label: 开启
              name: enabled
              id: ai_comment_extraction_enabled
              value: true
            - $formkit: aiModelSelector
              if: "$get(ai_comment_extraction_enabled).value === true"
              label: AI 模型
              modelType: language
              clearable: true
              name: modelName
              key: modelName
              placeholder: 请选择语言模型
              help: 可选，不设置时会使用 AI Foundation 的默认语言模型。
